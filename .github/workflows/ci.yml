name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  POSTGREST_URL: http://127.0.0.1:3001
  COGNITO_USER_POOL_ID: sa-east-1_ci
  COGNITO_CLIENT_ID: ci-client
  COGNITO_CLIENT_SECRET: ci-secret
  STORAGE_BUCKET: ci-bucket
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  ci:
    name: Typecheck · Lint · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
